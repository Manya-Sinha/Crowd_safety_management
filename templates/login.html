<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - CrowdSafe</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-body">
    <main class="login-card">
        <svg class="brand-shield" viewBox="0 0 64 72" aria-hidden="true">
            <path d="M32 3 6 13v22c0 17 11 29 26 34 15-5 26-17 26-34V13z" fill="rgba(0,160,255,.12)" stroke="#19b4ff" stroke-width="3"/>
            <circle cx="32" cy="26" r="6" fill="#19b4ff"/><circle cx="21" cy="30" r="4.5" fill="#19b4ff"/><circle cx="43" cy="30" r="4.5" fill="#19b4ff"/>
            <path d="M20 46c0-7 5-11 12-11s12 4 12 11z" fill="#19b4ff"/>
        </svg>
        <h1>CrowdSafe</h1>
        <p class="login-sub">Sign in to the Crowd Safety Management System</p>

        <form class="login-form" method="post" action="{{ url_for('login') }}" autocomplete="on">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required autofocus autocomplete="username">

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required autocomplete="current-password">

            {% if error %}<div class="login-error" role="alert">{{ error }}</div>{% endif %}

            <button type="submit" class="btn login-submit">Login</button>
        </form>
    </main>
</body>
</html>
